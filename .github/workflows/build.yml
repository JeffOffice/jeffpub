name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: windows-2022
            name: windows
          # One app for Apple silicon and Intel Macs (Qt's macOS build is
          # universal), unsigned for now.
          - os: macos-14
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'Linux'
        with:
          version: '6.8.3'
          modules: 'qtimageformats'
          cache: true

      # Windows builds with MinGW-w64 (GCC), the compiler Qt ships for Windows.
      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'Windows'
        with:
          version: '6.8.3'
          arch: 'win64_mingw'
          modules: 'qtimageformats'
          tools: 'tools_mingw1310'
          cache: true

      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'macOS'
        with:
          version: '6.8.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtimageformats'
          cache: true

      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: MinGW on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          pip install ninja

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libfuse2

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then CC=gcc CXX=g++; else CC=cc CXX=c++; fi
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX $EXTRA

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        shell: bash
        run: |
          # Windows runners drop this program's console output, so results also go to a file.
          if [ "$RUNNER_OS" = "Windows" ]; then
            T=build/jptests.exe
            # Programs in the build folder find the GCC runtime through PATH,
            # which can hold another GCC's copy first (the 20261004 runner
            # image crashed in the first test). Use the compiler's own copy,
            # beside the programs, as the packaged program does.
            echo "GCC runtimes on PATH:"; which -a libstdc++-6.dll || true
            cp "$(cygpath -u "$IQTA_TOOLS")/mingw1310_64/bin/"{libgcc_s_seh-1,libstdc++-6,libwinpthread-1}.dll build/
          else
            T=build/jptests
          fi
          set +e
          "$T" -v1 -o test-results.txt,txt -o -,txt
          code=$?
          echo "--- test-results.txt"; cat test-results.txt 2>/dev/null || echo "(no results file: the program did not start)"
          echo "jptests exit code: $code"
          # A crash on Linux: the tests again under the debugger, for the
          # stack (a crash can depend on the tests before it).
          if [ "$code" -ge 128 ] && [ "$RUNNER_OS" = "Linux" ] && command -v gdb >/dev/null; then
            echo "--- stack of the crash"
            gdb -q -batch -ex run -ex "thread apply all bt 30" --args "$T" -silent 2>&1 | grep -v '^\[' | tail -90
          fi
          exit $code
        env:
          QT_QPA_PLATFORM: offscreen
          JP_TEST_TRACE: '1'

      - name: Export check PDFs
        shell: bash
        run: |
          # PDFs exported by this platform's build, to compare against Linux.
          if [ "$RUNNER_OS" = "Windows" ]; then A=build/JeffPub.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then A=build/JeffPub.app/Contents/MacOS/JeffPub
          else A=build/JeffPub; fi
          mkdir -p pdf-check
          "$A" --template newsletter-classic --export-pdf pdf-check/newsletter-classic.pdf || true
          "$A" --template flyer-announce --export-pdf pdf-check/flyer-announce.pdf || true
          "$A" tests/data/pub/poi-SampleBrochure.pub --export-pdf pdf-check/poi-SampleBrochure.pdf || true
          "$A" tests/data/pub/poi-SampleNewsletter.pub --export-pdf pdf-check/poi-SampleNewsletter.pdf || true
          ls -la pdf-check
        env:
          QT_QPA_PLATFORM: offscreen

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-check-${{ matrix.name }}
          path: pdf-check

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/JeffPub | Out-Null
          Copy-Item build/JeffPub.exe dist/JeffPub/
          # Also copies the GCC runtime DLLs beside the program.
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw dist/JeffPub/JeffPub.exe
          Get-ChildItem dist/JeffPub/*.dll | Select-Object -ExpandProperty Name
          Copy-Item LICENSE, README.md dist/JeffPub/
          Copy-Item -Recurse resources/fonts dist/JeffPub/fonts
          Copy-Item -Recurse resources/dict dist/JeffPub/dict
          # PDFium, and its license texts and those of the libraries in it.
          Copy-Item build/pdfium.dll dist/JeffPub/
          New-Item -ItemType Directory -Force dist/JeffPub/licenses | Out-Null
          Copy-Item -Recurse third_party/pdfium/licenses dist/JeffPub/licenses/pdfium

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(JeffPub VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          makensis /DVERSION=$ver packaging/windows/installer.nsi
          New-Item -ItemType Directory -Force installer | Out-Null
          Move-Item packaging/windows/JeffPub-Setup.exe installer/

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: JeffPub-Setup
          path: installer

      # The command-line tool, for testing on Windows: it runs from the
      # program's folder (same DLLs). Not part of the release.
      - name: Developer tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dev-tools | Out-Null
          Copy-Item build/jpubtool.exe dev-tools/
          Copy-Item build/pdfium.dll dev-tools/

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: JeffPub-windows-tools
          path: dev-tools

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/JeffPub
          cp build/JeffPub LICENSE README.md dist/JeffPub/
          cp -r resources/fonts resources/dict dist/JeffPub/

      - name: Linux packages (.deb and AppImage)
        if: runner.os == 'Linux'
        run: |
          mkdir -p tools-bin
          curl -sSLo tools-bin/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSLo tools-bin/linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x tools-bin/*
          export PATH="$PWD/tools-bin:$PATH" QMAKE="$QT_ROOT_DIR/bin/qmake" APPIMAGE_EXTRACT_AND_RUN=1
          packaging/linux/build-packages.sh build linux-packages
          # The packaged program must start on its own bundled Qt.
          mkdir deb-check && dpkg-deb -x linux-packages/*.deb deb-check
          env -u LD_LIBRARY_PATH QT_QPA_PLATFORM=offscreen deb-check/opt/jeffpub/bin/JeffPub --template flyer-announce --export-pdf deb-check/check.pdf
          test -s deb-check/check.pdf
          # PDFium is in the package, with the license texts.
          test -f deb-check/opt/jeffpub/lib/libpdfium.so
          test -f deb-check/usr/share/doc/jeffpub/pdfium/pdfium.txt

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: JeffPub-linux-packages
          path: linux-packages

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ver=$(sed -n 's/^project(JeffPub VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p dist macos-dmg
          cp -R build/JeffPub.app dist/
          "$QT_ROOT_DIR/bin/macdeployqt" dist/JeffPub.app
          # PDFium beside the Qt frameworks, where the program finds it,
          # and its license texts and those of the libraries in it.
          fw=dist/JeffPub.app/Contents/Frameworks
          test -f "$fw/libpdfium.dylib" || cp build/_deps/pdfium/lib/libpdfium.dylib "$fw/"
          # The build's own path to it isn't for shipping (and would hide a
          # missing copy from the check below).
          install_name_tool -delete_rpath "$PWD/build/_deps/pdfium/lib" dist/JeffPub.app/Contents/MacOS/JeffPub || true
          otool -l dist/JeffPub.app/Contents/MacOS/JeffPub | grep -A2 LC_RPATH | grep path || true
          mkdir -p dist/JeffPub.app/Contents/Resources/licenses
          cp -R third_party/pdfium/licenses dist/JeffPub.app/Contents/Resources/licenses/pdfium
          # Not yet signed with a developer certificate: an ad-hoc signature
          # lets it run on Apple silicon.
          codesign --force --deep --sign - dist/JeffPub.app
          lipo -archs dist/JeffPub.app/Contents/MacOS/JeffPub
          # The packaged program must start on its own bundled Qt (and PDFium).
          QT_QPA_PLATFORM=offscreen dist/JeffPub.app/Contents/MacOS/JeffPub --template flyer-announce --export-pdf dist/check.pdf
          test -s dist/check.pdf && rm dist/check.pdf
          mkdir dmg-root && cp -R dist/JeffPub.app LICENSE README.md dmg-root/ && ln -s /Applications dmg-root/Applications
          # hdiutil now and then fails with "Resource busy" on the hosted
          # runners; a few tries a little apart get past it.
          for try in 1 2 3 4 5; do
            hdiutil create -volname "JeffPub" -srcfolder dmg-root -ov -format UDZO macos-dmg/JeffPub-$ver.dmg && break
            if [ "$try" = 5 ]; then exit 1; fi
            sleep 10
          done
          ls -la macos-dmg

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: JeffPub-macos-dmg
          path: macos-dmg

      - uses: actions/upload-artifact@v4
        with:
          name: JeffPub-${{ matrix.name }}
          path: dist/JeffPub
