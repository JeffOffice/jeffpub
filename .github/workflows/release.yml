name: release

# Publishes a release from a finished build's files. GitHub's own workflow
# token publishes it, so the release is listed as made by github-actions,
# not by a person's account. Run it by hand (Actions > release > Run
# workflow, or `gh workflow run release.yml`) once a build has passed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v0.5.3"
        required: true
      run_id:
        description: "The passed build run whose files to publish"
        required: true
      title:
        description: "Release title"
        required: true
      notes:
        description: "Release notes (Markdown)"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: JeffPub-*
          path: art
      - name: Gather the downloads
        run: |
          set -euo pipefail
          mkdir out
          cp art/JeffPub-Setup/JeffPub-Setup.exe out/
          (cd art/JeffPub-windows && zip -r -q -X ../../out/JeffPub-windows.zip .)
          cp art/JeffPub-linux-packages/*.deb art/JeffPub-linux-packages/*.AppImage out/
          cp art/JeffPub-macos-dmg/*.dmg out/
          ls -la out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
          PRE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          sha=$(gh run view "$RUN_ID" -R "$REPO" --json headSha,conclusion --jq 'select(.conclusion == "success") | .headSha')
          if [ -z "$sha" ]; then echo "Build run $RUN_ID didn't pass"; exit 1; fi
          printf '%s\n' "$NOTES" > notes.md
          # Published again (made by an account before): the release goes, its tag stays.
          if gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then gh release delete "$TAG" -R "$REPO" --yes; fi
          pre=()
          if [ "$PRE" = "true" ]; then pre=(--prerelease); fi
          gh release create "$TAG" -R "$REPO" --target "$sha" "${pre[@]}" --title "$TITLE" --notes-file notes.md out/*
